<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeri Pernikahan</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3ed;
            color: #52666b;
            font-family: 'Poppins', sans-serif;
        }

        .gallery-page {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 55px 25px;
        }

        /* Judul halaman */

        .gallery-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .gallery-heading .ornament {
            color: #b69a68;
            font-size: 25px;
            letter-spacing: 7px;
        }

        .gallery-heading h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 55px;
            font-weight: normal;
            color: #779b9d;
            margin: 8px 0;
        }

        .gallery-heading p {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Ornamen gebyok sederhana */

        .gebyok-frame {
            position: relative;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #e6ddcb;
            box-shadow: 0 8px 20px rgba(60, 70, 65, 0.10);
        }

        .gebyok-frame::before {
            content: "❧  ❋  ❧";
            display: block;
            text-align: center;
            color: #b69a68;
            padding: 5px;
            font-size: 18px;
        }

        .gebyok-frame::after {
            content: "❧  ❋  ❧";
            display: block;
            text-align: center;
            color: #b69a68;
            padding: 5px;
            font-size: 18px;
        }

        /* Bagian foto utama */

        .hero-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin-bottom: 25px;
            background: #c5dadd;
            box-shadow: 0 8px 20px rgba(60, 70, 65, 0.12);
        }

        .hero-text {
            min-height: 260px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #c5dadd;
            position: relative;
            overflow: hidden;
        }

        .hero-text::before {
            content: "✦  ·  ✧  ·  ✦";
            color: white;
            font-size: 17px;
            letter-spacing: 8px;
            margin-bottom: 18px;
        }

        .hero-text h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 43px;
            font-weight: normal;
            color: #ffffff;
        }

        .hero-text p {
            font-size: 11px;
            letter-spacing: 3px;
            color: #ffffff;
            margin-top: 10px;
        }

        .hero-photo {
            min-height: 260px;
            position: relative;
            overflow: hidden;
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            min-height: 260px;
            object-fit: cover;
            display: block;
        }

        .hero-photo .photo-caption {
            position: absolute;
            bottom: 18px;
            right: 18px;
            left: 18px;
            text-align: center;
            padding: 15px;
            color: white;
            background: rgba(30, 45, 40, 0.28);
        }

        .photo-caption h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            font-weight: normal;
        }

        /* Baris foto */

        .gallery-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .photo-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .photo-card {
            background: #ffffff;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(60, 70, 65, 0.08);
            min-width: 0;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 230px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-card img:hover {
            transform: scale(1.025);
        }

        /* Foto lingkaran */

        .round-photo-section {
            background: #c5dadd;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            box-shadow: 0 5px 15px rgba(60, 70, 65, 0.08);
        }

        .round-photo {
            width: 205px;
            height: 205px;
            border: 7px solid white;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 0 2px #b69a68;
        }

        .round-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Foto lebar dan teks */

        .wide-gallery {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0;
            background: #ffffff;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(60, 70, 65, 0.08);
        }

        .wide-photo img {
            width: 100%;
            height: 300px;
            display: block;
            object-fit: cover;
            cursor: pointer;
        }

        .love-note {
            background: #c5dadd;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .love-note h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 35px;
            font-weight: normal;
            color: white;
            margin-bottom: 12px;
        }

        .love-note p {
            color: #ffffff;
            font-size: 11px;
            line-height: 1.9;
        }

        /* Kolase foto bawah */

        .bottom-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background: white;
            padding: 12px;
            box-shadow: 0 5px 15px rgba(60, 70, 65, 0.08);
        }

        .bottom-main-photo {
            position: relative;
            padding: 10px;
            min-width: 0;
        }

        .bottom-main-photo img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
            cursor: pointer;
        }

        .date-badge {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 85px;
            background: #c5dadd;
            border: 5px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            line-height: 1.5;
        }

        .photo-collage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            background: #c5dadd;
            min-width: 0;
        }

        .photo-collage img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .photo-collage .collage-large {
            grid-column: span 2;
        }

        /* Tombol navigasi */

        .navigation {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .navigation a {
            text-decoration: none;
            color: #ffffff;
            background: #7d9fa2;
            padding: 11px 23px;
            border-radius: 3px;
            font-size: 12px;
            transition: background 0.3s;
        }

        .navigation a:hover {
            background: #587d80;
        }

        .footer-note {
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #779b9d;
            margin-top: 35px;
        }

        /* Tampilan foto besar ketika diklik */

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(20, 25, 25, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border: 4px solid white;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Tampilan HP */

        @media (max-width: 650px) {
            .gallery-page {
                padding: 30px 14px;
            }

            .gallery-heading h1 {
                font-size: 43px;
            }

            .hero-gallery {
                grid-template-columns: 1fr;
            }

            .hero-text {
                min-height: 180px;
            }

            .hero-photo,
            .hero-photo img {
                min-height: 250px;
                height: 250px;
            }

            .gallery-row {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .photo-card img {
                height: 190px;
            }

            .round-photo-section {
                min-height: 250px;
            }

            .round-photo {
                width: 175px;
                height: 175px;
            }

            .wide-gallery {
                grid-template-columns: 1fr;
            }

            .wide-photo img {
                height: 240px;
            }

            .love-note {
                min-height: 180px;
            }

            .bottom-gallery {
                grid-template-columns: 1fr;
            }

            .bottom-main-photo img {
                height: 240px;
            }

            .photo-collage img {
                height: 120px;
            }
        }
        
/* FOTO GALERI AESTHETIC */

.gallery-page img {
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(90, 130, 145, 0.12);
    transition: transform 0.5s ease,
                box-shadow 0.5s ease;
}

.gallery-page img:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 30px rgba(90, 130, 145, 0.20);
}

    </style>
</head>

<body>

    <main class="gallery-page">

        <!-- Judul galeri -->
        <header class="gallery-heading">
            <div class="ornament">❧ ❋ ❧</div>
            <h1>Kisah Katresnan</h1>
            <p>Perjalanan cinta kami</p>
        </header>

        <!-- Foto utama -->
        <section class="hero-gallery">
            <div class="hero-text">
                <h2>Wedding</h2>
                <p>THE BEGINNING OF FOREVER</p>
            </div>

            <div class="hero-photo">
                <img src="images/foto-utama.jpeg"
                     alt="Foto utama pasangan"
                     class="zoomable">

                <div class="photo-caption">
                    <h3>Nico & Fery</h3>
                </div>
            </div>
        </section>

        <!-- Baris foto dan foto lingkaran -->
        <section class="gallery-row">

            <div class="gebyok-frame">
                <div class="photo-pair">
                    <div class="photo-card">
                        <img src="images/foto-1.jpeg"
                             alt="Foto pasangan pertama"
                             class="zoomable">
                    </div>

                    <div class="photo-card">
                        <img src="images/foto-2.jpeg"
                             alt="Foto pasangan kedua"
                             class="zoomable">
                    </div>
                </div>
            </div>

            <div class="round-photo-section">
                <div class="round-photo">
                    <img src="images/foto-3.jpeg"
                         alt="Foto pasangan dalam bingkai bulat"
                         class="zoomable">
                </div>
            </div>

        </section>

        <!-- Foto lebar dan cerita -->
        <section class="wide-gallery">

            <div class="wide-photo">
                <img src="images/foto-4.jpeg"
                     alt="Momen romantis pasangan"
                     class="zoomable">
            </div>

            <div class="love-note">
                <h2>Kisah Cinta</h2>
                <p>
                    Dua hati, satu tujuan.
                    Semoga perjalanan ini menjadi
                    awal kebahagiaan dan cinta
                    yang tumbuh selamanya.
                </p>
            </div>

        </section>

        <!-- Kolase bagian bawah -->
        <section class="bottom-gallery">

            <div class="bottom-main-photo">
                <img src="images/foto-5.png"
                     alt="Foto kenangan pasangan"
                     class="zoomable">

                <div class="date-badge">
                    20<br>26
                </div>
            </div>

            <div class="photo-collage">
                <img src="images/foto-6.jpeg"
                     alt="Kolase foto satu"
                     class="zoomable">

                <img src="images/foto-7.jpeg"
                     alt="Kolase foto dua"
                     class="zoomable">

                <img src="images/foto-8.jpeg"
                     alt="Kolase foto tiga"
                     class="zoomable collage-large">
            </div>

        </section>

        <!-- Tombol navigasi -->
        <nav class="navigation">
            <a href="halaman-kedua.html">← Halaman Sebelumnya</a>
            <a href="halaman-keempat.html">Halaman Berikutnya →</a>
        </nav>

        <footer class="footer-note">
            With Love, Forever
        </footer>

    </main>

    <!-- Tampilan foto besar -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close"
                id="closeLightbox"
                aria-label="Tutup foto">&times;</button>

        <img src="" alt="Foto diperbesar" id="lightboxImage">
    </div>

    <script>
        const zoomableImages = document.querySelectorAll(".zoomable");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const closeLightbox = document.getElementById("closeLightbox");

        // Klik foto untuk memperbesar
        zoomableImages.forEach(function(image) {
            image.addEventListener("click", function() {
                lightboxImage.src = image.src;
                lightbox.classList.add("active");
            });
        });

        // Tutup tampilan foto
        closeLightbox.addEventListener("click", function() {
            lightbox.classList.remove("active");
        });

        // Tutup jika area gelap diklik
        lightbox.addEventListener("click", function(event) {
            if (event.target === lightbox) {
                lightbox.classList.remove("active");
            }
        });

        // Tutup menggunakan tombol Escape
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                lightbox.classList.remove("active");
            }
        });
    </script>
<audio id="weddingMusic" loop>
    <source src="music/lagu.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

<script>
    continueWeddingMusic();
</script>

<div class="petal-container">
    <span class="petal">✿</span>
    <span class="petal">❀</span>
    <span class="petal">✿</span>
    <span class="petal">❀</span>
    <span class="petal">✿</span>
</div>

</body>
</html>
